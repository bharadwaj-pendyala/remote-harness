services:
  chat:
    build:
      context: .
      target: chat
    environment:
      APP_REPO: ${APP_REPO:?Set APP_REPO}
      RECORD_REPO: ${RECORD_REPO:?Set RECORD_REPO}
      HARNESS_GITHUB_TOKEN: ${HARNESS_GITHUB_TOKEN:?Set HARNESS_GITHUB_TOKEN}
      CHAT_ACCESS_TOKEN: ${CHAT_ACCESS_TOKEN:?Set CHAT_ACCESS_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      HARNESS_REF: ${HARNESS_REF:-main}
    volumes:
      - chat-data:/data
      - ${HARNESS_REPO:?Set HARNESS_REPO to a standalone app clone}:/repository:ro
    restart: unless-stopped
  ui:
    build:
      context: .
      target: ui
    environment:
      CHAT_SERVICE_URL: http://chat:8787
      CHAT_ACCESS_TOKEN: ${CHAT_ACCESS_TOKEN:?Set CHAT_ACCESS_TOKEN}
      RECORD_REPO: ${RECORD_REPO:?Set RECORD_REPO}
    ports:
      - '127.0.0.1:8501:8501'
    depends_on:
      - chat
    restart: unless-stopped
volumes:
  chat-data:
