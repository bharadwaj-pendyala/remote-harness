name: clarify

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: run id, as run-<issue number>
        required: true
      request:
        description: what the stakeholder asked for
        required: true

permissions:
  contents: read

env:
  RECORD_REPO: ${{ github.repository }}
  APP_REPO: ${{ vars.APP_REPO }}

jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness

      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.APP_REPO }}
          path: app
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm i -g @anthropic-ai/claude-code

      - name: ask the questions
        working-directory: harness
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARNESS_REPO: ${{ github.workspace }}/app
          RUNS_DIR: ${{ github.workspace }}/runs
          RUN_ID: ${{ inputs.run_id }}
          REQUEST: ${{ inputs.request }}
        run: |
          # an API key, when present, overrides the subscription token
          if [ -n "$ANTHROPIC_API_KEY" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; else unset ANTHROPIC_API_KEY; fi
          node harness/run.mjs clarify --id "$RUN_ID" "$REQUEST"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record
          path: runs/
          if-no-files-found: ignore

  route:
    needs: work
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: record
          path: runs

      - name: stop the run when the stage produced nothing
        if: needs.work.result != 'success'
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_REPO: ${{ github.repository }}
          RUNS_DIR: ${{ github.workspace }}/runs
        run: |
          node harness/record.mjs pull "${{ inputs.run_id }}"
          node -e "
            const path = '${{ github.workspace }}/runs/${{ inputs.run_id }}/run.json';
            const record = JSON.parse(require('fs').readFileSync(path, 'utf8'));
            record.state = 'stopped';
            record.reason = 'the clarify stage failed, see the workflow log';
            record.history.push({ state: 'stopped', at: new Date().toISOString() });
            require('fs').writeFileSync(path, JSON.stringify(record, null, 2));
          "

      - name: write the record
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_REPO: ${{ github.repository }}
          RUNS_DIR: ${{ github.workspace }}/runs
        run: node harness/record.mjs push "${{ inputs.run_id }}"
