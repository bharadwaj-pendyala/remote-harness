name: execute
run-name: ${{ inputs.mode }} · ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: approved run id
        required: true
      mode:
        description: answer, execute, or repair
        required: false
        default: execute
      fast:
        description: skip the H.264 encode and review on a faster model
        required: false
        default: 'false'
      reply:
        description: the stakeholder reply, when the mode is answer
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: harness-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      baseCommit: ${{ steps.gate.outputs.baseCommit }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: validate dispatch inputs
        env:
          RUN_ID: ${{ inputs.run_id }}
          MODE: ${{ inputs.mode }}
        run: node harness/gate.mjs validate
      - name: read the current record
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: node harness/record.mjs pull "$RUN_ID"
      - id: gate
        env:
          RUN_ID: ${{ inputs.run_id }}
          MODE: ${{ inputs.mode }}
          RUNS_DIR: ${{ github.workspace }}/runs
        run: node harness/gate.mjs

  work:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      state: ${{ steps.result.outputs.state }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness

      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.APP_REPO }}
          path: app
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.baseCommit }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: read the record
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_REPO: ${{ github.repository }}
          RUNS_DIR: ${{ github.workspace }}/runs
        run: node harness/record.mjs pull "${{ inputs.run_id }}"

      - name: fetch the failing candidate
        if: inputs.mode == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the record is already on disk, so the prior artifacts land beside it, not over it
          prior=$(node -e "console.log(require('${{ github.workspace }}/runs/${{ inputs.run_id }}/run.json').actionsRunId)")
          gh run download "$prior" --repo "${{ github.repository }}" -n record -D "${{ github.workspace }}/prior"
          cp -r "${{ github.workspace }}/prior/${{ inputs.run_id }}/artifacts" \
                "${{ github.workspace }}/runs/${{ inputs.run_id }}/" 2>/dev/null || true
          cp "${{ github.workspace }}/prior/${{ inputs.run_id }}/candidate.bundle" \
             "${{ github.workspace }}/runs/${{ inputs.run_id }}/" 

      - name: restore the failing candidate
        if: inputs.mode == 'repair'
        working-directory: app
        run: |
          git fetch "${{ github.workspace }}/runs/${{ inputs.run_id }}/candidate.bundle" \
            "harness/${{ inputs.run_id }}:harness/${{ inputs.run_id }}"
          git checkout -q "harness/${{ inputs.run_id }}"

      - uses: actions/cache@v4
        if: inputs.mode != 'answer'
        with:
          path: |
            app/node_modules
            ~/.cache/ms-playwright
          key: app-${{ hashFiles('app/package-lock.json') }}

      - name: install the video encoder
        if: inputs.mode != 'answer' && inputs.fast != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: set the application up
        if: inputs.mode != 'answer'
        working-directory: app
        run: |
          ./scripts/setup-app
          npx playwright install --with-deps chromium

      - run: npm ci
        working-directory: harness

      - run: npm i -g @anthropic-ai/claude-code

      - name: run the agent
        working-directory: harness
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARNESS_REPO: ${{ github.workspace }}/app
          RUNS_DIR: ${{ github.workspace }}/runs
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          REPLY: ${{ inputs.reply }}
          ENCODE: ${{ inputs.fast == 'true' && 'off' || 'on' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'haiku' }}
        run: |
          # an API key, when present, overrides the subscription token
          if [ -n "$ANTHROPIC_API_KEY" ]; then unset CLAUDE_CODE_OAUTH_TOKEN; else unset ANTHROPIC_API_KEY; fi
          node harness/run.mjs "$MODE" "$RUN_ID" "$REPLY"


      - name: bundle the candidate
        if: always() && inputs.mode != 'answer'
        working-directory: app
        run: |
          git rev-parse --verify "harness/${{ inputs.run_id }}" >/dev/null 2>&1 || exit 0
          git add -A
          git diff --cached --quiet || git -c user.email=harness@bharad.dev -c user.name="Remote Harness" \
            commit -q -m "wip: candidate failing checks"
          git bundle create "${{ github.workspace }}/runs/${{ inputs.run_id }}/candidate.bundle" \
            "harness/${{ inputs.run_id }}"

      - name: stamp the run with this container
        if: always()
        run: |
          node -e "
            const path = '${{ github.workspace }}/runs/${{ inputs.run_id }}/run.json';
            const record = require(path);
            record.actionsRunId = '${{ github.run_id }}';
            require('fs').writeFileSync(path, JSON.stringify(record, null, 2));
          "

      - id: result
        if: always()
        working-directory: harness
        env:
          RUNS_DIR: ${{ github.workspace }}/runs
          RECORD_REPO: ${{ github.repository }}
        run: echo "state=$(node -e "console.log(require('${{ github.workspace }}/runs/${{ inputs.run_id }}/run.json').state)")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: record
          path: runs/
          if-no-files-found: ignore

  publish:
    needs: work
    if: needs.work.outputs.state == 'reviewed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness

      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.APP_REPO }}
          path: app
          fetch-depth: 1
          token: ${{ secrets.APP_REPO_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: harness

      - uses: actions/download-artifact@v4
        with:
          name: record
          path: runs

      - name: make sure gh can attach media
        run: |
          have=$(gh --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ "$(printf '%s\n2.99\n' "$have" | sort -V | head -1)" != "2.99" ]; then
            curl -fsSL https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz \
              | sudo tar -xz --strip-components=2 -C /usr/local/bin gh_2.101.0_linux_amd64/bin/gh
          fi
          gh --version

      - name: open the draft pull request
        working-directory: harness
        env:
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
          HARNESS_REPO: ${{ github.workspace }}/app
          RUNS_DIR: ${{ github.workspace }}/runs
          RECORD_REPO: ${{ github.repository }}
        run: |
          git -C "${{ github.workspace }}/app" fetch \
            "${{ github.workspace }}/runs/${{ inputs.run_id }}/candidate.bundle" \
            "harness/${{ inputs.run_id }}:harness/${{ inputs.run_id }}"
          git -C "${{ github.workspace }}/app" checkout -q "harness/${{ inputs.run_id }}"
          node harness/run.mjs publish "${{ inputs.run_id }}"

      - uses: actions/upload-artifact@v4
        with:
          name: published
          path: runs/

  route:
    needs: [gate, work, publish]
    if: always() && needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: harness

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.publish.result == 'success' && 'published' || 'record' }}
          path: runs

      - run: npm ci
        working-directory: harness

      - name: retain evidence and settle failures
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_REPO: ${{ github.repository }}
          RUNS_DIR: ${{ github.workspace }}/runs
          RUN_ID: ${{ inputs.run_id }}
          MODE: ${{ inputs.mode }}
          WORK_RESULT: ${{ needs.work.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [ ! -f "$RUNS_DIR/$RUN_ID/run.json" ]; then
            node harness/record.mjs pull "$RUN_ID"
          fi
          node harness/gate.mjs settle

      - name: write the record
        working-directory: harness
        env:
          GH_TOKEN: ${{ github.token }}
          RECORD_REPO: ${{ github.repository }}
          RUNS_DIR: ${{ github.workspace }}/runs
        run: node harness/record.mjs push "${{ inputs.run_id }}"

      - name: decide what happens next
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS_DIR: ${{ github.workspace }}/runs
        run: |
          record="${{ github.workspace }}/runs/${{ inputs.run_id }}/run.json"
          state=$(node -e "console.log(require('$record').state)")
          left=$(node -e "console.log(require('$record').repairsLeft)")

          case "$state" in
            check-failed|record-failed|review-failed)
              if [ "$left" -gt 0 ]; then
                echo "${state}, ${left} repair attempts left, dispatching a repair"
                gh workflow run execute.yml --repo "${{ github.repository }}" \
                  --ref "${{ github.ref_name }}" \
                  -f run_id="${{ inputs.run_id }}" -f mode=repair -f fast="${{ inputs.fast }}"
              else
                echo "${state} and the repair budget is spent, the run stops here"
              fi
              ;;
            published) echo "published, waiting on the requester" ;;
            stopped)   echo "stopped, evidence retained" ;;
            *)         echo "state ${state} needs no dispatch" ;;
          esac
